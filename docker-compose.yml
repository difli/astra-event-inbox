# =============================================================================
# docker-compose.yml – full local stack
#
# Runs in the colima-kafka Docker context:
#   docker --context colima-kafka compose up --build
#
# Brings up:
#   - Kafka (KRaft, no ZooKeeper) with dual listeners:
#       INTERNAL  – used by containers on the same Docker network
#       EXTERNAL  – used by the host Mac or any other external client
#   - Topic initialisation (one-shot)
#   - astra-event-inbox Spring Boot application (containerised)
#
# Astra DB is NOT local; credentials come from .env (never committed).
# Copy .env.example to .env and fill in your Astra credentials before starting.
#
# For host-side development (mvn spring-boot:run) use docker-compose.kafka.yml
# instead — it starts Kafka only and exposes it on COLIMA_HOST_IP:9092.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Kafka – KRaft mode (no ZooKeeper)
  # Dual listeners:
  #   INTERNAL://kafka:29092  → used by containers (inbox service, kafka-setup)
  #   EXTERNAL://0.0.0.0:9092 → mapped to the host; used by host-side clients
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: inbox-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      CLUSTER_ID: "astra-inbox-local-cluster"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Topic initialisation – runs once then exits
  # Uses the INTERNAL listener (container-to-container)
  # ---------------------------------------------------------------------------
  kafka-setup:
    image: confluentinc/cp-kafka:7.7.0
    container_name: inbox-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic cloud-events --partitions 6 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic cloud-events.DLT --partitions 1 --replication-factor 1 &&
        echo 'Topics created successfully'

  # ---------------------------------------------------------------------------
  # astra-event-inbox Spring Boot application (containerised)
  # Connects to Kafka via the INTERNAL listener (same Docker network)
  # ---------------------------------------------------------------------------
  inbox:
    build: .
    container_name: astra-event-inbox
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Mount the Astra Secure Connect Bundle from the host (read-only)
      - ${ASTRA_SECURE_BUNDLE_PATH_HOST:?Set ASTRA_SECURE_BUNDLE_PATH_HOST in .env}:/app/certs/bundle.zip:ro
    env_file:
      - .env
    environment:
      # Internal listener: container-to-container
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Override bundle path to the container-internal mount point
      ASTRA_SECURE_BUNDLE_PATH: /app/certs/bundle.zip
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
